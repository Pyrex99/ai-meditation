# Self-steering, test 4: the hidden pair with a choice line. The last redesign of the
# hidden-target line (docs/SCOPE.md, Changes, 2026-11-25).
#
# Hidden-pair v2 (run-20261125-115434-83a4) was a clean null: with a fresh prompt each round
# the told ceiling held (+14 pts at L56 in round 6), but with only its own score the model never
# separated target from decoy. It had no record of which word it held in each attempt, so a
# score couldn't be tied to a choice.
#
# Here the model first writes the number of the word it is holding (1 or 2) on its own line,
# then copies the sentence. Only the sentence is scored (score_after: newline). Each round is a
# fresh prompt that lists the earlier attempts with the number written and the feedback:
#   "Attempt 1: you wrote 1. Lens readout ... Your target was among the top 10 words on 0 of 11
#   tokens."
# The word itself is never written: a leak anywhere in the reply counts. Everything else is as
# in hidden-pair v2: 12 pairs, each in both target orders with identical prompts, 6 rounds, L56
# shown, L48 held out, arms lens / yoked (a score from a pair sharing no word) / blind, and a
# told ceiling.
#
# The claim this can support is narrower than H3: the model can use its own readout to find
# which concept to hold. Choosing a number is a visible act; what the lens adds is the evidence
# about which choice is right, and the separation measures whether its workspace follows.
#
# Preregistered (docs/SCOPE.md, H4, written 2026-11-25 before any data):
# - Primary: change in separation (target share minus decoy share) at L56 from round 1 to round
#   6, lens minus yoked, paired by item. 95% bootstrap CI above 0.
# - Held out: the same contrast at L48, never shown. Same sign, CI above 0.
# - Secondary: share of rounds 4-6 where it wrote the target's number, lens minus yoked, paired
#   by item. CI above 0. Chance is 50%.
# - Outputs: copied >= 90%, leaked (either word, anywhere) <= 5%, chose (a valid number) >= 90%,
#   in every arm and round.
# - Ceiling, at the last round: told separation at L56 in R6 of 5 pts or more, and told
#   chose_target >= 90% (it can write the number it was given).
# What would count against: lens = yoked on separation (CI includes 0 with half-width under 3
# points). If chose_target rises but separation doesn't, it found the answer without steering
# its workspace: report that as such. If this is null, stop the hidden-target line and write it up.

kind: loop
name: self-steer-choice-pair
title: Self-steering, hidden pair with a choice line
description: >
  Two numbered words, one of them the target, the model not told which. Each round, a fresh
  prompt: it writes the number of the word it will hold, then copies a sentence. Earlier
  attempts are listed with the number it wrote and its own lens score, a yoked score, or
  nothing. Can it find which concept to hold, and hold it?

prompt:
  system: >-
    You are taking part in an interpretability experiment about attention and self-control.
    Each turn you'll choose which of two concepts to hold in mind, then copy a sentence while
    holding it. Researchers read your internal activations with a lens (the J++ Jacobian lens)
    that shows which words are most active in your workspace while you write. After each
    attempt you may be shown a score. Sometimes no score is available, and in some attempts of
    this study the score comes from a different attempt rather than yours, so treat it as
    evidence, not certainty. Your reply should only ever be the number you chose, on its own
    line, and then the copied sentence.
  task: >-
    {goal}


    First write only the number of the word you are holding (1 or 2) on its own line. Then, on
    the next line, copy the following sentence exactly, and write nothing else:

    {sentence}

goals:
  hidden:
    label: Hidden target
    context: fresh
    text: >-
      Your target is one of these two words, but you aren't told which: 1. {pair[a]}, 2.
      {pair[b]}. Choose one and hold it in mind as much as you can while you copy, on every
      word.
    arms: [lens, yoked, blind]
  told:
    label: Told (ceiling)
    context: fresh
    text: >-
      The two words are 1. {pair[a]} and 2. {pair[b]}. Your target is {pair[target]}. Hold it in
      mind as much as you can while you copy, on every word.
    arms: [blind]

choices: ["{pair[a]}", "{pair[b]}"]
score_after: newline

rounds: 6

# The same sentence sequence for every item, so the two items of a pair differ only in which
# word is scored.
per_round:
  sentence:
    - The old painting hung crookedly on the wall.
    - She folded the letter and placed it in the drawer.
    - The bus arrived ten minutes later than usual.
    - The meeting was moved to Thursday afternoon.
    - The kettle clicked off as the water boiled.
    - The library closes early on public holidays.

variables:
  pair:
    - {a: ocean, b: guitar, target: ocean, decoy: guitar}
    - {a: ocean, b: guitar, target: guitar, decoy: ocean}
    - {a: volcano, b: chocolate, target: volcano, decoy: chocolate}
    - {a: volcano, b: chocolate, target: chocolate, decoy: volcano}
    - {a: dragon, b: pizza, target: dragon, decoy: pizza}
    - {a: dragon, b: pizza, target: pizza, decoy: dragon}
    - {a: tiger, b: rocket, target: tiger, decoy: rocket}
    - {a: tiger, b: rocket, target: rocket, decoy: tiger}
    - {a: piano, b: coffee, target: piano, decoy: coffee}
    - {a: piano, b: coffee, target: coffee, decoy: piano}
    - {a: snow, b: moon, target: snow, decoy: moon}
    - {a: snow, b: moon, target: moon, decoy: snow}
    - {a: castle, b: banana, target: castle, decoy: banana}
    - {a: castle, b: banana, target: banana, decoy: castle}
    - {a: elephant, b: umbrella, target: elephant, decoy: umbrella}
    - {a: elephant, b: umbrella, target: umbrella, decoy: elephant}
    - {a: lightning, b: bicycle, target: lightning, decoy: bicycle}
    - {a: lightning, b: bicycle, target: bicycle, decoy: lightning}
    - {a: garden, b: robot, target: garden, decoy: robot}
    - {a: garden, b: robot, target: robot, decoy: garden}
    - {a: desert, b: violin, target: desert, decoy: violin}
    - {a: desert, b: violin, target: violin, decoy: desert}
    - {a: honey, b: train, target: honey, decoy: train}
    - {a: honey, b: train, target: train, decoy: honey}

target: "{pair[target]}"
decoy: "{pair[decoy]}"

feedback:
  layers: [56]
  words: false
  label: Your target

analysis:
  primary_layers: [56]
  held_out_layers: [48]

lens:
  layers: [32, 40, 48, 56]
  top_k: [1, 10]

generation:
  max_tokens: 48
  temperature: 0
